[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ecocode"
version = "0.1.0"
description = "Python SDK for EcoCode — energy and carbon tracking for ML training and inference."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EcoCode Authors" }]
keywords = ["energy", "carbon", "ml", "llm", "monitoring", "sustainability", "rlhf", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]

# No Python runtime dependencies — sensors and HTTP are in compiled Rust
dependencies = []

[project.optional-dependencies]
hf        = ["transformers>=4.30.0"]
trl       = ["trl>=0.7.0"]
lightning = ["pytorch-lightning>=2.0.0"]
all       = ["transformers>=4.30.0", "trl>=0.7.0"]
dev       = ["pytest>=7.0.0", "pytest-mock>=3.0.0", "responses>=0.25.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "ecocode._core"
