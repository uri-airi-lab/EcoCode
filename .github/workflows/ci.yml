name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,    python: "3.9" }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, python: "3.13" }
          - { name: macos-arm64,    os: macos-latest,     python: "3.13" }
          - { name: macos-x86_64,   os: macos-15-intel,   python: "3.13" }
          - { name: windows-x86_64, os: windows-latest,   python: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: ecocode doctor
        run: cargo run --locked --quiet -- doctor

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The end-to-end tests drive target/debug/ecocode (built by `cargo test`)
      # with fake sensors, so they need no hardware.
      - name: Python SDK tests
        run: |
          python -m pip install pytest
          python -m pytest python/tests/unit python/tests/e2e -q

  # Real ML frameworks (tiny CPU models) driving the real callbacks and the real
  # binary. Linux only: vLLM/DeepSpeed need CUDA and skip themselves.
  python-frameworks:
    name: python frameworks (linux-x86_64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build ecocode binary
        run: cargo build --locked -p ecocode-cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install SDK with framework test extras (CPU torch wheels)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pytest>=7" transformers datasets "trl>=0.15" pytorch-lightning keras onnx onnxruntime

      - name: Framework integration tests
        env:
          KERAS_BACKEND: torch
        run: python -m pytest python/tests/frameworks -v -rs

  wheels:
    name: wheel (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: linux-arm64,    os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-latest }
          - { name: macos-x86_64,   os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version pinned in rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Linux wheels are built on the runner's glibc; build them in a manylinux
      # container (e.g. PyO3/maturin-action) before publishing to PyPI.
      - name: Build wheel (SDK + bundled ecocode binary)
        shell: bash
        run: |
          python -m pip install "maturin>=1.7,<2"
          cd python
          maturin build --release -o ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
