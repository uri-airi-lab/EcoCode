[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
axum-extra = "0.12.5"
dotenv = "0.15.0"
futures = "0.3.32"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "macros", "runtime-tokio-rustls", "chrono"] }
tokio = {version = "1.49.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.2", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = "0.4"
