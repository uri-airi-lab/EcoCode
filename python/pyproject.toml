[build-system]
# The wheel bundles the `ecocode` monitor binary (built from crates/ecocode-cli)
# next to the Python package, so `pip install ecocodes` is all a user needs.
# Building from source requires Rust (rust-toolchain.toml pins the version).
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
# The PyPI name is "ecocodes" because "ecocode" was taken. The import name
# (`import ecocode`) and the command (`ecocode`) are unchanged.
name = "ecocodes"
version = "1.0.0"
description = "Python SDK for EcoCode, energy and carbon tracking for ML training and inference."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "EcoCode Authors" }]
keywords = ["energy", "carbon", "ml", "llm", "monitoring", "sustainability", "rlhf", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

# Zero runtime dependencies, HTTP via stdlib urllib.request,
# energy monitoring via the bundled ecocode CLI binary.
dependencies = []

[project.urls]
Homepage = "https://ecocode.harmonyhpc.io"
Documentation = "https://github.com/uri-airi-lab/EcoCode/tree/main/docs"
Source = "https://github.com/uri-airi-lab/EcoCode"
Issues = "https://github.com/uri-airi-lab/EcoCode/issues"

[project.optional-dependencies]
hf        = ["transformers>=4.30.0"]
trl       = ["trl>=0.7.0"]
lightning  = ["pytorch-lightning>=2.0.0"]
keras     = ["keras>=3.0.0"]
onnx      = ["onnxruntime>=1.16.0"]
deepspeed = ["deepspeed>=0.10.0"]
vllm      = ["vllm>=0.3.0"]
all       = ["transformers>=4.30.0", "trl>=0.7.0", "pytorch-lightning>=2.0.0", "keras>=3.0.0", "onnxruntime>=1.16.0"]
# Real-framework tests (tests/frameworks): CPU-only, tiny models, no network.
test-frameworks = [
    "pytest>=7.0.0",
    "torch>=2.0.0",
    "torchvision",
    "transformers>=4.45.0",
    "datasets>=2.0.0",
    "trl>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "keras>=3.0.0",
    "onnx",
    "onnxruntime>=1.16.0",
]
dev       = ["pytest>=7.0.0", "pytest-mock>=3.0.0", "maturin>=1.7,<2"]

[tool.maturin]
# "bin": package the CLI binary into the wheel's scripts directory, so it is
# installed as `ecocode` / `ecocode.exe` on PATH next to `python`.
bindings = "bin"
manifest-path = "../crates/ecocode-cli/Cargo.toml"
python-source = "src"
# The import name stays `ecocode` although the PyPI name is `ecocodes`.
module-name = "ecocode"
python-packages = ["ecocode"]
locked = true

[tool.pytest.ini_options]
# unit: no hardware, frameworks or binary needed.
# e2e: runs the real ecocode binary with fake sensors (skipped if it isn't built).
# frameworks: real ML frameworks (tiny CPU models) driving the real callbacks and
#   binary, run explicitly: pytest tests/frameworks  (pip install -e ".[test-frameworks]")
# integration: real GPT-2/ResNet workloads, CUDA if present, run explicitly:
#   pytest -m heavy tests/integration  (set ECOCODE_HEAVY_SCALE=0.05 on CPU)
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["src"]
markers = [
    "frameworks: real-framework tests with tiny CPU models (tests/frameworks)",
    "heavy: large real workloads from tests/integration; CUDA recommended",
    "cuda: needs a CUDA device; skipped otherwise",
]
